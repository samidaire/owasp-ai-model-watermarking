[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sigil-watermark"
version = "0.2.0"
description = "Framework-agnostic neural-network watermarking with zero-knowledge ownership proofs (Circom + SnarkJS)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Sami Daire" },
  { name = "Mohamed Ansari" },
  { name = "Arfat Shaikh" },
  { name = "Yash Bandiwadekar" },
]
dependencies = [
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tf = ["tensorflow>=2.16", "tf2onnx>=1.16"]          # tf2onnx: Keras -> ONNX export (WM-05)
onnx = ["onnx>=1.16", "onnxscript>=0.2"]             # onnxscript: torch.onnx.export(dynamo=True)
# sigil.zk needs only the standard library in Python; its toolchain (Node.js >= 20.19 with snarkjs from
# circuits/package.json, and circom 2.2.3) is not on PyPI and is installed by setup.ps1 / setup.sh.
zk = []
attacks = ["torch>=2.2", "scipy>=1.11", "scikit-learn>=1.4"]   # sigil.attacks / `sigil attack` (ROB-01, ROB-02)
dev = ["pytest>=8", "pytest-timeout>=2.3", "jsonschema>=4.20"]

[project.scripts]
sigil = "sigil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigil"]
