# Alembic configuration for the Sigil backend (DB-01).
#
#   alembic -c backend/alembic.ini upgrade head          # from the repo root
#   python -m backend.app.cli migrate                    # same, using DATABASE_URL / backend/.env
#
# The database URL comes from DATABASE_URL (see backend/app/config.py); sqlalchemy.url below is only a
# fallback for running alembic by hand against a scratch database.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
# sqlalchemy.url = postgresql+psycopg://sigil:sigil@127.0.0.1:5432/sigil

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
